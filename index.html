<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>
<body class="bg-sky-200 text-slate-100 min-h-screen flex items-center justify-center p-4">
    

    <div class="container w-full max-w-md bg-slate-900 border border-green-800 rounded-2xl p-6 shadow-2xl space-y-6" id="container">
        <div class="text-center">
            <h1 class="text-2xl font-bold tracking-tight text-red-800">Currency Converter</h1>
       </div>
    <div>
        <label for="amount" class="block text-xs font-semibold text-green-400 mb-2">Enter Amount</label>
        <input
        type="number"
        id="amount"
        class="w-full bg-slate-800/80 border-green-700 rounded-xl px-4 py-2"
        placeholder="1.00"
        min="0"
        step="any"
        value="1.00">
    </div>


<div class="fromto grid grid-cols-[1fr_auto_1fr] items-end gap-4" id="fromto">

    <div>
    <select name="from" id="from" class="from w-full bg-black rounded-xl px-3 py-2">
        <option disabled selected>Loading....</option>
    </select>

    </div>
<div>
    <button class="swap-btn bg-orange-500 p-3 hover:bg-orange-700 rounded-xl" id="swap-btn">Swap</button>
</div>

<div>
        <select name="to" id="to" class="to w-full bg-black rounded-xl px-3 py-2">
            <option disabled selected>Loading....</option>
        </select>
</div>

<div class="convert " id="convert">
    <button class="convert-btn w-full bg-red-600 hover:bg-red-500 text-white font-bold py-3 rounded-full" id="convert-btn">Convert</button>



</div>

</div>


<div id="exchange-result" class="exchange-result mt-6 text-center text-xl font-bold" hidden>
<span id="amount-entered" class="text-white"></span>
<span class="text-green-500 mx-2 text-2xl">=</span>
<span id="rate-result" class="text-orange-400"></span>
   


</div>



    </div>
    <script src="main.js"></script>
</body>
</html>
